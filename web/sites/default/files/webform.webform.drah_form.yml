id: drah_form
title: 'Drah Form'
description: 'this is just a replicating the ui and logic web handlers of sdge drah'
categories: {  }
elements: |-
  eligibility:
    '#type': webform_wizard_page
    '#title': Eligibility
    '#open': true
    elig1_container:
      '#type': container
      deed_body_message:
        '#type': webform_section
        '#title': 'Deed-Restricted Affordable Housing Attestation for Eligible Customers'
        '#description': |-
          Deed-Restricted Affordable Housing (DRAH) are rental properties on the California Housing Partnership's (CHP) affordable housing list, requiring residents to earn 80% or less of the Area Median Income. Customers living in DRAH properties on the CHP list are eligible for a discounted Base Services Charge of approximately $12.00 a month.

           
          SDG&E sent letters or emails to customers who may live in an eligible DRAH property. If you received a letter or email and live in a DRAH property, you must affirm your eligibility by filling out the attestation form below in order to receive the discounted Base Services Charge.  After your form is processed, you’ll see any eligible Base Services Charge discounts reflected on future bills.

           
          If you do NOT live in an eligible DRAH unit, you do not need to do anything. For more information, visit chpc.net.
        '#description_display': before
      did_you_receive_a_letter_from_sdg_e_asking_you_to_attest_to_livi:
        '#type': select
        '#title': 'Did you receive a letter from SDG&E asking you to attest to living in a Deed Restricted Affordable unit?'
        '#title_display': before
        '#options':
          'Yes': 'Yes'
          'No': 'No'
        '#select2': true
        '#required': true
      do_you_live_in_an_affordable_rental_home_subject_to_federal_or_s:
        '#type': select
        '#title': 'Do you live in an affordable rental home subject to federal or state subsidy restrictions for residents with income at or below 80% of the Area Median Income?'
        '#title_display': before
        '#options':
          'Yes': 'Yes'
          'No': 'No'
        '#select2': true
        '#required': true
        '#states':
          visible:
            ':input[name="did_you_receive_a_letter_from_sdg_e_asking_you_to_attest_to_livi"]':
              value: 'Yes'
      validation_if_answer_is_no:
        '#type': webform_section
        '#title': 'validation if answer is no '
        '#description': 'Only properties that are listed on the California Housing Partnership list are eligible for the DRAH discounted Base Services Charge. To be eligible you must have received a letter or email from SDG&E asking you to attest. See if you qualify for an income-based discount on your Base Services Charge through enrollment in one of SDG&E’s assistance programs at sdge.com/assistance.'
        '#title_display': invisible
        '#description_display': after
        '#required': true
        '#states':
          visible:
            - ':input[name="did_you_receive_a_letter_from_sdg_e_asking_you_to_attest_to_livi"]':
                value: 'No'
            - or
            - ':input[name="do_you_live_in_an_affordable_rental_home_subject_to_federal_or_s"]':
                value: 'No'
  account_verification:
    '#type': webform_wizard_page
    '#title': 'Account Verification'
    '#open': true
    ac_container:
      '#type': container
      deed_restricted_affordable_housing_attestation_for_eligible_cust:
        '#type': webform_section
        '#title': 'Deed-Restricted Affordable Housing Attestation for Eligible Customers'
        '#description_display': before
        account_number:
          '#type': fieldset
          '#title': 'Account Number'
          '#help_title': 'Required Fields'
          '#description_display': before
          '#help_display': title_before
          '#required': true
          sdg_e_account_number:
            '#type': textfield
            '#title': 'SDG&E Account Number'
            '#description': 'First 12 digits of your account number is found at the top of your bill. If you can’t find it, try logging into My Energy Center.'
            '#title_display': before
            '#description_display': after
            '#minlength': 1
            '#maxlength': 12
            '#size': 500
            '#autocomplete': 'off'
            '#required': true
            '#unique': true
        account_type:
          '#type': fieldset
          '#title': 'Account Type'
          is_your_account_in_a_business_name:
            '#type': radios
            '#title': 'Is your account in a business name? '
            '#title_display': before
            '#options':
              'No': 'No'
              'Yes': 'Yes'
            '#required': true
        account_holder:
          '#type': fieldset
          '#title': 'Account Holder'
          '#description': 'Enter the primary account holder’s name or the co-application name. You may not attest if your name is not on the account. You must enter your first and last name exactly as it is displayed on your bill.'
          '#description_display': before
          '#states':
            visible:
              ':input[name="is_your_account_in_a_business_name"]':
                value: 'No'
          key_flexbox_account:
            '#type': webform_flexbox
            account_holder_first_name:
              '#type': textfield
              '#title': 'Account Holder First Name'
              '#title_display': before
              '#input_mask': "'casing': 'upper'"
              '#required': true
            account_holder_last_name:
              '#type': textfield
              '#title': ' Account Holder Last Name'
              '#title_display': before
              '#input_mask': "'casing': 'upper'"
              '#required': true
          i_am_the_account_holder_or_co_applicant:
            '#type': checkbox
            '#title': 'I am the account holder or co-applicant. '
            '#required': true
    business_information:
      '#type': fieldset
      '#title': 'Business Information'
      '#description': 'You must enter your business name exactly as it is displayed on your bill.'
      '#description_display': before
      '#states':
        visible:
          ':input[name="is_your_account_in_a_business_name"]':
            value: 'Yes'
      business_name:
        '#type': textfield
        '#title': 'Business Name'
        '#required': true
    account_email:
      '#type': fieldset
      '#title': Email
      '#description': 'If you would like a confirmation of this form emailed to you, please enter a valid email address. Entering an email address here will not update your SDG&E account information.'
      '#description_display': before
      email:
        '#type': textfield
        '#title': Email
        '#title_display': before
        '#input_mask': "'alias': 'email'"
        '#required': true
    deed_restricted_affordable_house_attestation:
      '#type': fieldset
      '#title': 'Deed-Restricted Affordable House Attestation'
      '#description': 'By checking below, I attest to the following information:'
      '#description_display': before
      first_certify_reside:
        '#type': checkbox
        '#title': 'I certify that I reside at the property associated with the account number above and that my unit is an affordable rental home subject to federal or state subsidy restrictions for residents with income at or below 80% of the Area Median Income.'
        '#required': true
      certify_attest_2:
        '#type': checkbox
        '#title': 'I understand that to be considered a DRAH customer, my property must be listed as a deed-restricted affordable property with the California Housing Partnership (CHP). If the property is removed from the CHP list or I relocate, I will no longer be eligible for a discounted Base Services Charge.'
        '#required': true
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#states':
      disabled:
        - ':input[name="did_you_receive_a_letter_from_sdg_e_asking_you_to_attest_to_livi"]':
            value: 'No'
        - or
        - ':input[name="do_you_live_in_an_affordable_rental_home_subject_to_federal_or_s"]':
            value: 'No'
    '#submit__label': Submit
    '#update_hide': true
    '#wizard_prev_hide': true
    '#wizard_next__label': Next
    '#delete_hide': false
    '#delete__label': Reset
css: |
  .webform-submission-form .form-action{
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .webform-submission-form .webform-button--next{
    margin-left: auto;
    background-color: green;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
  }

  /* Hover effect */
  .webform-button--next.button.js-form-submit.form-submit.cv-validate-before-ajax:hover {
    background-color: #218838;
  }

  /* Responsive adjustment for mobile */
  @media (max-width: 600px) {
    .webform-button--next.button.js-form-submit.form-submit.cv-validate-before-ajax {
      width: 100%;
      float: none;
      text-align: center;
    }
  }


  /* Center align and customize font for section titles */
  .webform-section-title {
    text-align: center;
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    font-size: 2.5rem; 
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 20px;
  }
javascript: |
  (function ($, Drupal) {
    Drupal.behaviors.blockNextIfNo = {
      attach: function (context, settings) {
        $('.webform-submission-form', context).once('blockNextIfNo').each(function () {
          const $form = $(this);
          const $nextButton = $form.find('#edit-wizard-next');

          function checkEligibility() {
            const val1 = $form.find('select[name="did_you_receive_a_letter_from_sdg_e_asking_you_to_attest_to_livi"]').val();
            const val2 = $form.find('select[name="do_you_live_in_an_affordable_rental_home_subject_to_federal_or_s"]').val();

            if (val1 === 'No' || val2 === 'No') {
              $nextButton.prop('disabled', true).css({
                'opacity': '0.5',
                'cursor': 'not-allowed'
              });
            } else {
              $nextButton.prop('disabled', false).css({
                'opacity': '1',
                'cursor': 'pointer'
              });
            }
          }

          // Initial check
          checkEligibility();

          // Re-check on change
          $form.find('select').on('change', checkEligibility);
        });
      }
    };
  })(jQuery, Drupal);
